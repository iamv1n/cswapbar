  <title>CSwapBar</title>
  <defs>
    <mask id="im0" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="black"/><circle cx="50.00" cy="38.00" r="27" fill="white"/><circle cx="60.39" cy="56.00" r="27.0" fill="black"/></mask><linearGradient id="ig0" gradientUnits="userSpaceOnUse" x1="23.0" y1="11.0" x2="77.0" y2="65.0"><stop offset="0" stop-color="#FFB38A"/><stop offset="1" stop-color="#E0603F"/></linearGradient><mask id="im1" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="black"/><circle cx="60.39" cy="56.00" r="27" fill="white"/><circle cx="39.61" cy="56.00" r="27.0" fill="black"/></mask><linearGradient id="ig1" gradientUnits="userSpaceOnUse" x1="33.4" y1="29.0" x2="87.4" y2="83.0"><stop offset="0" stop-color="#F48FB1"/><stop offset="1" stop-color="#8E3B8F"/></linearGradient><mask id="im2" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="black"/><circle cx="39.61" cy="56.00" r="27" fill="white"/><circle cx="50.00" cy="38.00" r="27.0" fill="black"/></mask><linearGradient id="ig2" gradientUnits="userSpaceOnUse" x1="12.6" y1="29.0" x2="66.6" y2="83.0"><stop offset="0" stop-color="#FFD08A"/><stop offset="1" stop-color="#D9782F"/></linearGradient>
    <radialGradient id="bg" cx="0.3" cy="0.2" r="1"><stop offset="0" stop-color="#2C2333"/><stop offset="1" stop-color="#0D0A11"/></radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E0603F" stop-opacity="0.35"/><stop offset="1" stop-color="#E0603F" stop-opacity="0"/></radialGradient>
