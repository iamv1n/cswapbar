name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check the [roadmap](https://github.com/iamv1n/cswapbar/blob/main/ROADMAP.md) first; it might already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this myself
